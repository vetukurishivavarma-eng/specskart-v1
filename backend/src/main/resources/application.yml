spring:
  application:
    name: specskart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate.format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework   # Render terminates TLS; trust X-Forwarded-* for absolute URLs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

specskart:
  store-name: ${SPECSKART_STORE_NAME:Specskart}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  business-whatsapp-number: ${SPECSKART_BUSINESS_WA_NUMBER:+260000000000}
  cors-origins: ${SPECSKART_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  session:
    expiry-hours: ${FRAME_FINDER_SESSION_EXPIRY_HOURS:72}
  face:
    retain-images: ${FACE_RETAIN_IMAGES:false}
  simulation:
    enabled: ${SPECSKART_SIMULATION_ENABLED:true}
  security:
    jwt-secret: ${SESSION_SECRET:dev-only-insecure-secret-change-me-please-32bytes-minimum!!}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:720}
  promo:
    face-analysis-percent: ${PROMO_FACE_ANALYSIS_PERCENT:10}
    face-analysis-hours: ${PROMO_FACE_ANALYSIS_HOURS:48}
  loyalty:
    points-per-kwacha: ${LOYALTY_POINTS_PER_KWACHA:1}   # 1 point per K1 spent
    point-value-minor: ${LOYALTY_POINT_VALUE_MINOR:10}  # 1 point = K0.10 off
    referral-friend-percent: ${LOYALTY_REFERRAL_FRIEND_PERCENT:10}
    referral-reward-points: ${LOYALTY_REFERRAL_REWARD_POINTS:200}
    min-redeem-points: ${LOYALTY_MIN_REDEEM_POINTS:100}
  lenses:
    single-vision-add-minor: ${LENS_SINGLE_VISION_MINOR:15000}   # +K150
    progressive-add-minor: ${LENS_PROGRESSIVE_MINOR:45000}       # +K450
    blue-light-add-minor: ${LENS_BLUE_LIGHT_MINOR:8000}          # +K80
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:dev-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:}
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com/v21.0}
    # Approved template used for agent-initiated re-engagement outside the 24h window.
    # {{1}} = lead first name, {{2}} = store name. Leave blank to disable the follow-up action.
    follow-up-template: ${WHATSAPP_FOLLOW_UP_TEMPLATE:}
    follow-up-template-lang: ${WHATSAPP_FOLLOW_UP_TEMPLATE_LANG:en}
    # Approved marketing template for the post-delivery message; {{1}}=first name, {{2}}=promo code.
    # Without it the job still sends a plain message (delivered only if the 24h window is open).
    post-purchase-template: ${WHATSAPP_POST_PURCHASE_TEMPLATE:}
    # Approved template for customer order-status updates (PAID/PACKED/SHIPPED/…). Delivered even
    # outside the 24h window. {{1}}=first name, {{2}}=status line, {{3}}=order number, {{4}}=tracking URL.
    # Blank = plain text, which Meta only delivers while the customer's 24h service window is open —
    # so website buyers who never messaged first get nothing. Uses follow-up-template-lang.
    order-update-template: ${WHATSAPP_ORDER_UPDATE_TEMPLATE:}
    # Approved template for the staff new-order alert. {{1}}=order number, {{2}}=amount,
    # {{3}}=customer, {{4}}=admin link. Blank = plain text (staff rarely have an open 24h window).
    staff-order-template: ${WHATSAPP_STAFF_ORDER_TEMPLATE:}
    # WhatsApp numbers alerted when a new order is paid (so someone starts packing).
    # Comma-separated, e.g. +260972809599,+260971234567. Blank = no alerts.
    staff-numbers: ${WHATSAPP_STAFF_NUMBERS:}
  payments:
    provider: ${PAYMENTS_PROVIDER:mock}   # mock | flutterwave
    flutterwave:
      secret-key: ${FLW_SECRET_KEY:}
      secret-hash: ${FLW_SECRET_HASH:}
      base-url: ${FLW_BASE_URL:https://api.flutterwave.com}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:specskart;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: mock
  datasource:
    url: jdbc:h2:mem:specskart;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Phase 2 migrations (V8–V11) were authored after V12 was already applied to prod;
    # they're all independent additive DDL, so applying them out of order is safe.
    out-of-order: true
